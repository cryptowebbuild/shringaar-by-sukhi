                          <select 
                            value={conciergeForm.weddingDate}
                            onChange={(e) => setConciergeForm({ ...conciergeForm, weddingDate: e.target.value })}
                            className="w-full text-xs p-2.5 rounded-lg border border-royalBurgundy-700 bg-royalBurgundy-900 text-white focus:outline-none focus:border-antiqueGold-500"
                          >
                            <option value="Next 1-2 Months (Rush Order)">Next 1-2 Months</option>
                            <option value="Next 3-6 Months">Next 3-6 Months</option>
                            <option value="Next 6-12 Months">Next 6-12 Months</option>
                            <option value="Festive/Sangeet Guest">Festive/Guest</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-[11px] text-gray-400 block mb-1">Delivery Destination</label>
                          <select 
                            value={conciergeForm.country}
                            onChange={(e) => setConciergeForm({ ...conciergeForm, country: e.target.value })}
                            className="w-full text-xs p-2.5 rounded-lg border border-royalBurgundy-700 bg-royalBurgundy-900 text-white focus:outline-none focus:border-antiqueGold-500"
                          >
                            <option value="USA (New York, California, Texas)">USA (DHL Express)</option>
                            <option value="United Kingdom (London, Midlands)">UK (DHL Express)</option>
                            <option value="Canada (Toronto, Vancouver)">Canada (DHL Express)</option>
                            <option value="UAE (Dubai / Abu Dhabi)">UAE (Local Courier)</option>
                            <option value="Australia & New Zealand">Australia / NZ</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">Outfit Colorway or Custom Notes</label>
                        <textarea 
                          rows="2"
                          value={conciergeForm.notes}
                          onChange={(e) => setConciergeForm({ ...conciergeForm, notes: e.target.value })}
                          placeholder="e.g., Deep Crimson lehenga, request matching emerald drops..."
                          className="w-full text-xs p-2.5 rounded-lg border border-royalBurgundy-700 bg-royalBurgundy-900 text-white focus:outline-none focus:border-antiqueGold-500"
                        ></textarea>
                      </div>
                    </div>
                  </>
                )}
              </div>

              {/* Drawer Footer */}
              {cart.length > 0 && (
                <div className="p-6 bg-royalBurgundy-950 border-t border-royalBurgundy-800 space-y-3">
                  <div className="flex items-center justify-between text-sm">
                    <span className="text-gray-400">Total Bridal Investment:</span>
                    <span className="font-cormorant font-bold text-2xl text-antiqueGold-400">
                      {formatPrice(cartTotal)}
                    </span>
                  </div>

                  <button 
                    onClick={handleWhatsAppCheckout}
                    className="w-full bg-[#25D366] hover:bg-[#1ebd5a] text-white font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition"
                  >
                    <i data-lucide="message-circle" className="w-5 h-5"></i>
                    <span>Inquire via WhatsApp Concierge</span>
                  </button>

                  <p className="text-[10px] text-gray-500 text-center">
                    🔒 Certified High-Jewellery Craftsmanship • Insured Worldwide Doorstep Delivery
                  </p>
                </div>
              )}

            </div>
          </div>
        </div>
      )}

      {/* 10. QUICK VIEW MODAL */}
      {quickViewItem && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div onClick={() => setQuickViewItem(null)} className="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>

          <div className="relative bg-royalBurgundy-900 border border-antiqueGold-500/30 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl z-10 grid grid-cols-1 md:grid-cols-2">
            <div className="relative aspect-[4/5] bg-royalBurgundy-950">
              <img src={quickViewItem.image} alt={quickViewItem.name} className="w-full h-full object-cover" />
              <div className="absolute top-3 left-3 bg-antiqueGold-500 text-royalBurgundy-950 text-xs px-2.5 py-1 rounded font-bold font-cormorant">
                {quickViewItem.badge}
              </div>
            </div>

            <div className="p-6 flex flex-col justify-between space-y-4">
              <div>
                <div className="flex items-center justify-between">
                  <span className="text-xs text-antiqueGold-400 font-bold uppercase tracking-wider font-cormorant">{quickViewItem.craftingTime}</span>
                  <button onClick={() => setQuickViewItem(null)} className="text-gray-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <h3 className="font-cormorant font-bold text-xl text-white mt-2">
                  {quickViewItem.name}
                </h3>
                <div className="font-cormorant font-bold text-2xl text-antiqueGold-400 mt-1">
                  {formatPrice(quickViewItem.priceAED)}
                </div>

                <div className="mt-4 space-y-2 text-xs text-gray-300 border-y border-royalBurgundy-800 py-3">
                  <div className="flex justify-between">
                    <span className="text-gray-500">Stones:</span>
                    <span className="font-semibold text-white">{quickViewItem.stones}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-500">Finish:</span>
                    <span className="font-semibold text-white">{quickViewItem.finish}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-500">Set Includes:</span>
                    <span className="font-semibold text-white">{quickViewItem.includes}</span>
                  </div>
                </div>

                <p className="text-xs text-gray-400 mt-3 leading-relaxed">
                  {quickViewItem.description}
                </p>
              </div>

              <div className="flex gap-3">
                <button 
                  onClick={() => {
                    addToCart(quickViewItem);
                    setQuickViewItem(null);
                  }}
                  className="flex-1 bg-antiqueGold-500 hover:bg-antiqueGold-400 text-royalBurgundy-950 font-bold py-3 rounded-xl text-xs transition font-cormorant uppercase tracking-wider text-sm"
                >
                  Acquire Piece
                </button>
                <button 
                  onClick={() => {
                    addToCart(quickViewItem);
                    setQuickViewItem(null);
                    setIsCartOpen(true);
                  }}
                  className="bg-[#25D366] hover:bg-[#1ebd5a] text-white p-3 rounded-xl transition flex items-center justify-center"
                >
                  <i data-lucide="message-circle" className="w-5 h-5"></i>
                </button>
              </div>

            </div>
          </div>
        </div>
      )}

      {/* 11. FOMO TOAST */}
      {showFomo && (
        <div className="fixed bottom-5 left-5 z-40 bg-royalBurgundy-900/95 backdrop-blur-md border border-antiqueGold-500/40 rounded-xl shadow-2xl p-3.5 max-w-sm flex items-center gap-3.5">
          <div className="w-10 h-10 rounded-full bg-emerald-950 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shrink-0">
            <i data-lucide="check-circle-2" className="w-5 h-5"></i>
          </div>
          <div className="text-xs">
            <div className="font-bold text-white flex items-center gap-1 font-cormorant">
              <span>{LIVE_ORDERS[fomoIndex].name}</span>
              <span className="text-gray-400 font-normal font-sans">({LIVE_ORDERS[fomoIndex].city})</span>
            </div>
            <div className="text-antiqueGold-400 font-medium truncate max-w-[210px]">
              Just inquired: {LIVE_ORDERS[fomoIndex].item}
            </div>
            <div className="text-[10px] text-gray-500 mt-0.5">
              {LIVE_ORDERS[fomoIndex].time} • Dubai Atelier Dispatch
            </div>
          </div>
          <button onClick={() => setShowFomo(false)} className="text-gray-500 hover:text-white ml-1">
            <i data-lucide="x" className="w-3.5 h-3.5"></i>
          </button>
        </div>
      )}

      {/* 12. FLOATING CONCIERGE BUTTON */}
      <button 
        onClick={() => setIsCartOpen(true)}
        className="fixed bottom-6 right-6 z-40 bg-gradient-to-r from-antiqueGold-500 to-antiqueGold-400 hover:from-antiqueGold-400 hover:to-antiqueGold-300 text-royalBurgundy-950 p-4 rounded-full shadow-2xl hover:scale-110 transition-all flex items-center justify-center group font-bold"
        title="Bridal Concierge"
      >
        <i data-lucide="sparkles" className="w-6 h-6"></i>
        <span className="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 ease-in-out text-xs uppercase tracking-wider font-cormorant pl-0 group-hover:pl-2">
          Bridal Concierge
        </span>
      </button>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
